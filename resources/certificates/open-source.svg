<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="550" fill="url(#bgGrad)" rx="16"/>

  <!-- Outer Decorative Border -->
  <rect x="25" y="25" width="750" height="500" fill="none" stroke="url(#goldGrad)" stroke-width="3" rx="12" opacity="0.8"/>
  <rect x="35" y="35" width="730" height="480" fill="none" stroke="url(#goldGrad)" stroke-width="1" rx="8" stroke-dasharray="8 4" opacity="0.5"/>

  <!-- Corner Accents -->
  <path d="M 25 60 L 25 25 L 60 25" fill="none" stroke="#00f5ff" stroke-width="5"/>
  <path d="M 775 60 L 775 25 L 740 25" fill="none" stroke="#00f5ff" stroke-width="5"/>
  <path d="M 25 490 L 25 525 L 60 525" fill="none" stroke="#00f5ff" stroke-width="5"/>
  <path d="M 775 490 L 775 525 L 740 525" fill="none" stroke="#00f5ff" stroke-width="5"/>

  <!-- Header Banner -->
  <text x="400" y="90" font-family="'Poppins', 'Segoe UI', sans-serif" font-weight="700" font-size="20" fill="#00f5ff" text-anchor="middle" letter-spacing="4">OFFICIAL CERTIFICATION OF ACHIEVEMENT</text>
  <path d="M 250 105 L 550 105" stroke="url(#accentGrad)" stroke-width="2"/>

  <!-- Main Content -->
  <text x="400" y="150" font-family="'Poppins', 'Segoe UI', sans-serif" font-weight="400" font-size="16" fill="#94a3b8" text-anchor="middle">This is to certify that</text>

  <text x="400" y="200" font-family="'Poppins', 'Segoe UI', sans-serif" font-weight="800" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="1">MOHAMMED RAYYAN</text>
  <path d="M 220 215 L 580 215" stroke="url(#accentGrad)" stroke-width="3"/>

  <text x="400" y="255" font-family="'Poppins', 'Segoe UI', sans-serif" font-weight="400" font-size="15" fill="#cbd5e1" text-anchor="middle">has successfully demonstrated proficiency and met all official standards for</text>

  <!-- Title Badge -->
  <rect x="150" y="280" width="500" height="65" rx="10" fill="rgba(0, 245, 255, 0.05)" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <text x="400" y="322" font-family="'Poppins', 'Segoe UI', sans-serif" font-weight="700" font-size="24" fill="#00f5ff" text-anchor="middle" filter="url(#glow)">Open Source Software</text>

  <!-- Issuer Info -->
  <text x="400" y="380" font-family="'Poppins', 'Segoe UI', sans-serif" font-weight="500" font-size="15" fill="#94a3b8" text-anchor="middle">Issued by <tspan fill="#ffffff" font-weight="600">Open Source Initiative</tspan></text>

  <!-- Seal / Badge Icon -->
  <g transform="translate(110, 420)">
    <circle cx="35" cy="35" r="30" fill="url(#goldGrad)" opacity="0.2"/>
    <circle cx="35" cy="35" r="25" fill="none" stroke="#00f5ff" stroke-width="2"/>
    <path d="M 35 18 L 40 28 L 51 30 L 43 38 L 45 49 L 35 43 L 25 49 L 27 38 L 19 30 L 30 28 Z" fill="#00f5ff"/>
  </g>

  <!-- Signatures / Footer Info -->
  <g transform="translate(200, 440)">
    <path d="M 0 30 Q 30 10 60 25 T 120 20" fill="none" stroke="#00f5ff" stroke-width="2" opacity="0.8"/>
    <line x1="0" y1="35" x2="150" y2="35" stroke="#475569" stroke-width="1"/>
    <text x="75" y="52" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Authorized Signature</text>
  </g>

  <g transform="translate(500, 440)">
    <text x="0" y="15" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">Issue Date: <tspan fill="#ffffff">November 2025</tspan></text>
    <text x="0" y="33" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">Credential ID: <tspan fill="#00f5ff">CERT-OS-2025-5510</tspan></text>
    <text x="0" y="51" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="11" fill="#10b981">✓ VERIFIED &amp; AUTHENTIC</text>
  </g>

</svg>